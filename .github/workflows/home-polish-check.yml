name: One-off home archive polish check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/home-polish-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/site.log; exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify home
        run: |
          mkdir -p qa/home-polish
          cat > qa/home-polish/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const width of [320,1440]){
            const mobile=width<700;
            const ctx=await browser.newContext({viewport:{width,height:mobile?900:1000},isMobile:mobile,hasTouch:mobile});
            const page=await ctx.newPage();
            const errors=[],consoleErrors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            await page.evaluate(async()=>{document.documentElement.style.scrollBehavior='auto';if(document.fonts?.ready)await document.fonts.ready;const sleep=ms=>new Promise(r=>setTimeout(r,ms));for(let y=0;y<document.documentElement.scrollHeight;y+=700){scrollTo(0,y);await sleep(50)}scrollTo(0,0);await sleep(160)});
            const metrics=await page.evaluate(()=>{
              const tagline=getComputedStyle(document.querySelector('.brand-copy'),'::after');
              const blurbs=[...document.querySelectorAll('.keeper-blurb')];
              const header=document.querySelector('.site-header').getBoundingClientRect();
              const brand=document.querySelector('.brand').getBoundingClientRect();
              const nav=document.querySelector('.desktop-nav').getBoundingClientRect();
              const order=document.querySelector('.header-actions').getBoundingClientRect();
              return {
                viewport:innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                taglineContent:tagline.content,
                taglineDisplay:tagline.display,
                blurbs:blurbs.map(x=>({text:x.textContent.trim(),display:getComputedStyle(x).display})),
                header:{left:header.left,right:header.right},
                brand:{left:brand.left,right:brand.right},
                nav:{left:nav.left,right:nav.right,display:getComputedStyle(document.querySelector('.desktop-nav')).display},
                order:{left:order.left,right:order.right},
                overlapsDesktop:getComputedStyle(document.querySelector('.desktop-nav')).display!=='none' && (brand.right>nav.left || nav.right>order.left)
              };
            });
            report.push({width,...metrics,errors,consoleErrors});
            await page.screenshot({path:`qa/home-polish/home-${width}.png`,fullPage:true});
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('qa/home-polish/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          const m=report.find(r=>r.width===320), d=report.find(r=>r.width===1440);
          const bad=report.some(r=>r.viewport!==r.scrollWidth||r.errors.length||r.consoleErrors.length)
            || m.blurbs.some(x=>x.display!=='none')
            || !d.taglineContent.includes('Уникальные фигурки с характером')
            || d.blurbs.filter(x=>x.display!=='none').length!==3
            || d.overlapsDesktop;
          if(bad) process.exit(1);
          EOF
          node qa/home-polish/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-polish-check
          path: qa/home-polish
          retention-days: 1
