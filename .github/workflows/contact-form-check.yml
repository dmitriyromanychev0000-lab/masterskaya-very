name: One-off contact form check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contact-form-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/contact.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/site.log; exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify contact form
        run: |
          mkdir -p qa/contact-form
          cat > qa/contact-form/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const width of [320,430,1440]){
            const mobile=width<700;
            const ctx=await browser.newContext({viewport:{width,height:mobile?900:1000},isMobile:mobile,hasTouch:mobile});
            await ctx.grantPermissions(['clipboard-read','clipboard-write'],{origin:'http://127.0.0.1:4173'});
            const page=await ctx.newPage();
            const errors=[],consoleErrors=[],opened=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('popup',p=>opened.push(p.url()));
            await page.goto('http://127.0.0.1:4173/contact.html',{waitUntil:'networkidle'});
            await page.fill('[name="name"]','Дмитрий');
            await page.fill('[name="reply"]','@example');
            await page.fill('[name="message"]','Хочу обсудить индивидуального Жителя');
            await page.locator('[data-contact-message-form] button[type="submit"]').click();
            await page.waitForTimeout(300);
            const status=await page.locator('[data-contact-form-status]').textContent();
            const clip=await page.evaluate(()=>navigator.clipboard.readText());
            await page.evaluate(async()=>{document.documentElement.style.scrollBehavior='auto';const sleep=ms=>new Promise(r=>setTimeout(r,ms));for(let y=0;y<document.documentElement.scrollHeight;y+=700){scrollTo(0,y);await sleep(40)}scrollTo(0,0);await sleep(100)});
            await page.screenshot({path:`qa/contact-form/contact-${width}.png`,fullPage:true});
            const metrics=await page.evaluate(()=>({
              viewport:innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              fields:document.querySelectorAll('[data-contact-message-form] input,[data-contact-message-form] textarea').length,
              small:[...document.querySelectorAll('a,button,summary,input,textarea')].filter(e=>{const r=e.getBoundingClientRect(),cs=getComputedStyle(e);return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0&&(r.width<44||r.height<44)}).map(e=>{const r=e.getBoundingClientRect();return {tag:e.tagName,text:(e.textContent||e.getAttribute('placeholder')||'').trim().slice(0,50),w:Math.round(r.width),h:Math.round(r.height)}})
            }));
            report.push({width,...metrics,status,clipboard:clip,opened,errors,consoleErrors});
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('qa/contact-form/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          EOF
          node qa/contact-form/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: contact-form-check
          path: qa/contact-form
          retention-days: 1
