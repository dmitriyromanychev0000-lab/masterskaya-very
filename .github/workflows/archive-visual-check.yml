name: One-off archive visual check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/archive-visual-check.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/site.log; exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture
        run: |
          mkdir -p qa/archive
          cat > qa/archive/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          for (const width of [320,430]) {
            const ctx = await browser.newContext({viewport:{width,height:900},isMobile:true,hasTouch:true});
            const page = await ctx.newPage();
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            await page.evaluate(async()=>{ if(document.fonts?.ready) await document.fonts.ready; const sleep=(ms)=>new Promise(r=>setTimeout(r,ms)); for(let y=0;y<document.documentElement.scrollHeight;y+=700){scrollTo(0,y);await sleep(70);}scrollTo(0,0);await sleep(150);});
            await page.screenshot({path:`qa/archive/home-${width}.png`,fullPage:true});
            await page.locator('[data-menu-button]').click();
            await page.screenshot({path:`qa/archive/menu-${width}.png`,fullPage:false});
            await ctx.close();
          }
          await browser.close();
          EOF
          node qa/archive/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: archive-visual-check
          path: qa/archive/*.png
          retention-days: 1
