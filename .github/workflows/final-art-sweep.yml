name: One-off final art sweep
# rerun-vignettes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-art-sweep.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/site.log; exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture full site
        run: |
          mkdir -p qa/final-art
          cat > qa/final-art/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser=await chromium.launch({headless:true});
          const pages=[
            ['home','index.html'],
            ['residents','residents.html'],
            ['world-winter','collection.html?world=winter'],
            ['chronicle-horse','chronicle.html?resident=humpbacked-horse'],
            ['about','about.html'],
            ['process','process.html'],
            ['contact','contact.html'],
            ['create','create.html']
          ];
          const widths=[320,360,390,430,1440];
          const report=[];
          for(const [name,path] of pages){
            for(const width of widths){
              const mobile=width<700;
              const ctx=await browser.newContext({
                viewport:{width,height:mobile?900:1000},
                isMobile:mobile,
                hasTouch:mobile,
                reducedMotion:'no-preference'
              });
              const page=await ctx.newPage();
              const errors=[],consoleErrors=[],failed=[];
              page.on('pageerror',e=>errors.push(String(e)));
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('requestfailed',r=>failed.push(r.url()));
              await page.goto('http://127.0.0.1:4173/'+path,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{
                document.documentElement.style.scrollBehavior='auto';
                if(document.fonts?.ready) await document.fonts.ready;
                const sleep=ms=>new Promise(r=>setTimeout(r,ms));
                for(let y=0;y<document.documentElement.scrollHeight;y+=700){scrollTo(0,y);await sleep(55)}
                scrollTo(0,0); await sleep(260);
              });
              await page.screenshot({path:`qa/final-art/${name}-${width}.png`,fullPage:true});
              const metrics=await page.evaluate(()=>({
                viewport:innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                bodyFont:getComputedStyle(document.body).fontFamily,
                h1Font:document.querySelector('h1')?getComputedStyle(document.querySelector('h1')).fontFamily:null,
                small:[...document.querySelectorAll('a,button,summary,input,textarea')].filter(e=>{
                  const r=e.getBoundingClientRect(),cs=getComputedStyle(e);
                  return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0&&(r.width<44||r.height<44)
                }).map(e=>({tag:e.tagName.toLowerCase(),text:(e.textContent||e.getAttribute('placeholder')||'').trim().replace(/\s+/g,' ').slice(0,60),w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)}))
              }));
              report.push({name,width,...metrics,errors,consoleErrors,failed});
              await ctx.close();
            }
          }
          await browser.close();
          fs.writeFileSync('qa/final-art/report.json',JSON.stringify(report,null,2));
          const summary={
            states:report.length,
            overflowStates:report.filter(x=>x.scrollWidth>x.viewport).length,
            mobileSmallTargetStates:report.filter(x=>x.width<700&&x.small.length).length,
            errorStates:report.filter(x=>x.errors.length||x.consoleErrors.length||x.failed.length).length
          };
          console.log(JSON.stringify(summary,null,2));
          EOF
          node qa/final-art/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-art-sweep
          path: qa/final-art
          retention-days: 1
