name: One-off typography archive check
# world-color-pass

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/typography-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/site.log; exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify typography
        run: |
          mkdir -p qa/type
          cat > qa/type/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const [name,path] of [['home','index.html'],['residents','residents.html']]){
            for(const width of [320,1440]){
              const mobile=width<700;
              const ctx=await browser.newContext({viewport:{width,height:mobile?900:1000},isMobile:mobile,hasTouch:mobile});
              const page=await ctx.newPage();
              const failed=[],errors=[];
              page.on('requestfailed',r=>failed.push(r.url()));
              page.on('pageerror',e=>errors.push(String(e)));
              await page.goto('http://127.0.0.1:4173/'+path,{waitUntil:'networkidle'});
              await page.evaluate(async()=>{if(document.fonts?.ready) await document.fonts.ready;});
              await page.screenshot({path:`qa/type/${name}-${width}.png`,fullPage:true});
              const data=await page.evaluate(()=>({
                viewport:innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                bodyFont:getComputedStyle(document.body).fontFamily,
                h1Font:getComputedStyle(document.querySelector('h1')).fontFamily,
                noteFont:document.querySelector('.hero-photo-note,.residents-intro-note') ? getComputedStyle(document.querySelector('.hero-photo-note,.residents-intro-note')).fontFamily : null,
                fonts:{
                  cormorant:document.fonts.check('16px "Cormorant Garamond"'),
                  manrope:document.fonts.check('16px "Manrope"'),
                  script:document.fonts.check('16px "Marck Script"')
                }
              }));
              report.push({name,width,...data,failed,errors});
              await ctx.close();
            }
          }
          await browser.close();
          fs.writeFileSync('qa/type/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          EOF
          node qa/type/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: typography-check
          path: qa/type
          retention-days: 1
