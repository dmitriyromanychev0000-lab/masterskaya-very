name: One-off dragons cartouche check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dragons-cartouche-check.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS 'http://127.0.0.1:4173/collection.html?world=dragons' >/dev/null && exit 0; sleep 1; done
          cat /tmp/site.log; exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture dragons world
        run: |
          mkdir -p qa/dragons-cartouche
          cat > qa/dragons-cartouche/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const width of [320,1440]){
            const mobile=width<700;
            const ctx=await browser.newContext({viewport:{width,height:mobile?900:1000},isMobile:mobile,hasTouch:mobile});
            const page=await ctx.newPage();
            const errors=[],failed=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',r=>failed.push(r.url()));
            await page.goto('http://127.0.0.1:4173/collection.html?world=dragons',{waitUntil:'networkidle'});
            await page.evaluate(async()=>{document.documentElement.style.scrollBehavior='auto';if(document.fonts?.ready)await document.fonts.ready;});
            await page.screenshot({path:`qa/dragons-cartouche/dragons-${width}.png`,fullPage:true});
            const metrics=await page.evaluate(()=>{
              const c=document.querySelector('.world-cartouche');
              const style=c?getComputedStyle(c):null;
              return {
                viewport:innerWidth,
                scrollWidth:document.documentElement.scrollWidth,
                cartouches:document.querySelectorAll('.world-cartouche').length,
                visible:Boolean(c && style && style.display!=='none' && c.getBoundingClientRect().width>0 && c.getBoundingClientRect().height>0),
                complete:Boolean(c?.complete),
                naturalWidth:c?.naturalWidth||0
              };
            });
            report.push({width,...metrics,errors,failed});
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('qa/dragons-cartouche/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          const desktop=report.find(x=>x.width===1440);
          const mobile=report.find(x=>x.width===320);
          const ok=desktop?.scrollWidth===desktop?.viewport && desktop?.cartouches===1 && desktop?.visible && desktop?.complete && desktop?.naturalWidth>0 && desktop?.errors.length===0 && desktop?.failed.length===0 && mobile?.scrollWidth===mobile?.viewport && mobile?.cartouches===1 && !mobile?.visible && mobile?.errors.length===0 && mobile?.failed.length===0;
          if(!ok) process.exit(1);
          EOF
          node qa/dragons-cartouche/check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dragons-cartouche-check
          path: qa/dragons-cartouche
          retention-days: 1
