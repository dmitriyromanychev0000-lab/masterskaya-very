name: One-off home pass2 check
on:
  push:
    branches: [main]
    paths: [".github/workflows/home-pass2-check.yml"]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          mkdir -p qa/home2
          cat > qa/home2/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const width of [320,430,1440]){
            const mobile=width<700;
            const ctx=await browser.newContext({viewport:{width,height:mobile?900:1000},isMobile:mobile,hasTouch:mobile});
            const page=await ctx.newPage(); const errors=[]; const failed=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',r=>failed.push(r.url()));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
            await page.evaluate(async()=>{document.documentElement.style.scrollBehavior='auto';if(document.fonts?.ready)await document.fonts.ready;const sleep=ms=>new Promise(r=>setTimeout(r,ms));for(let y=0;y<document.documentElement.scrollHeight;y+=700){scrollTo(0,y);await sleep(60)}scrollTo(0,0);await sleep(180)});
            await page.screenshot({path:`qa/home2/home-${width}.png`,fullPage:true});
            const m=await page.evaluate(()=>({
              viewport:innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              worlds:[...document.querySelectorAll('.world-card')].map(e=>({w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)})),
              worldsGrid:getComputedStyle(document.querySelector('.worlds-grid')).display,
              heroImages:[...document.querySelectorAll('.hero-resident-image')].map(i=>({src:i.getAttribute('src'),complete:i.complete,naturalWidth:i.naturalWidth})),
              small:[...document.querySelectorAll('a,button')].filter(e=>{const r=e.getBoundingClientRect(),cs=getComputedStyle(e);return innerWidth<700&&cs.display!=='none'&&r.width>0&&r.height>0&&(r.width<44||r.height<44)}).map(e=>({text:e.textContent.trim().replace(/\s+/g,' ').slice(0,45),w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)}))
            }));
            report.push({width,...m,errors,failed});
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('qa/home2/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          EOF
          node qa/home2/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: home-pass2-check
          path: qa/home2
          retention-days: 1
