name: One-off cartouche check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cartouche-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS 'http://127.0.0.1:4173/collection.html?world=winter' >/dev/null && exit 0; sleep 1; done
          cat /tmp/site.log; exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify cartouches
        run: |
          mkdir -p qa/cartouches
          cat > qa/cartouches/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const world of ['winter','forest','dragons','russian','home']){
            const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            const failed=[],consoleErrors=[],pageErrors=[];
            page.on('requestfailed',r=>failed.push(r.url()));
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto(`http://127.0.0.1:4173/collection.html?world=${world}`,{waitUntil:'networkidle'});
            await page.evaluate(async()=>{if(document.fonts?.ready)await document.fonts.ready;});
            const metrics=await page.evaluate(()=>({
              world:document.querySelector('[data-collection-root]')?.dataset?.world,
              cartoucheCount:document.querySelectorAll('.world-cartouche').length,
              cartoucheSrc:document.querySelector('.world-cartouche')?.getAttribute('src')||null,
              naturalWidth:document.querySelector('.world-cartouche')?.naturalWidth||0,
              viewport:innerWidth,
              scrollWidth:document.documentElement.scrollWidth
            }));
            await page.screenshot({path:`qa/cartouches/${world}.png`,fullPage:false});
            report.push({...metrics,failed,consoleErrors,pageErrors});
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('qa/cartouches/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          EOF
          node qa/cartouches/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cartouche-check
          path: qa/cartouches
          retention-days: 1
