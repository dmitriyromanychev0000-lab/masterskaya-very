name: One-off Humpbacked studio gallery check
# rerun-sprite-cascade-fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/humpbacked-gallery-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS 'http://127.0.0.1:4173/chronicle.html?resident=humpbacked-horse' >/dev/null && exit 0; sleep 1; done
          cat /tmp/site.log; exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify gallery
        run: |
          mkdir -p qa/humpbacked
          cat > qa/humpbacked/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const report=[];
          for(const width of [320,430,1440]){
            const mobile=width<700;
            const ctx=await browser.newContext({viewport:{width,height:mobile?900:1000},isMobile:mobile,hasTouch:mobile});
            const page=await ctx.newPage();
            const errors=[],consoleErrors=[],failed=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('requestfailed',r=>failed.push(r.url()));
            await page.goto('http://127.0.0.1:4173/chronicle.html?resident=humpbacked-horse',{waitUntil:'networkidle'});
            await page.evaluate(async()=>{document.documentElement.style.scrollBehavior='auto';if(document.fonts?.ready)await document.fonts.ready;const sleep=ms=>new Promise(r=>setTimeout(r,ms));for(let y=0;y<document.documentElement.scrollHeight;y+=650){scrollTo(0,y);await sleep(50)}scrollTo(0,0);await sleep(160)});
            const count=await page.locator('[data-chronicle-gallery-item]').count();
            const spriteLoaded=await page.evaluate(()=>[...document.querySelectorAll('.chronicle-gallery-sprite')].every(el=>getComputedStyle(el).backgroundImage.includes('humpbacked-horse.webp')));
            const galleryHeight=await page.locator('.chronicle-gallery-grid').evaluate(el=>Math.round(el.getBoundingClientRect().height));
            await page.locator('[data-chronicle-gallery-item="0"]').click();
            const firstDialog=await page.evaluate(()=>({
              open:document.querySelector('[data-chronicle-lightbox]')?.open,
              pos:getComputedStyle(document.querySelector('[data-chronicle-lightbox-image]')).backgroundPosition,
              size:getComputedStyle(document.querySelector('[data-chronicle-lightbox-image]')).backgroundSize
            }));
            await page.keyboard.press('Escape');
            await page.locator('[data-chronicle-gallery-item="7"]').click();
            const lastDialog=await page.evaluate(()=>({
              open:document.querySelector('[data-chronicle-lightbox]')?.open,
              pos:getComputedStyle(document.querySelector('[data-chronicle-lightbox-image]')).backgroundPosition
            }));
            await page.keyboard.press('Escape');
            const metrics=await page.evaluate(()=>({
              viewport:innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              small:[...document.querySelectorAll('a,button,summary')].filter(e=>{const r=e.getBoundingClientRect(),cs=getComputedStyle(e);return cs.display!=='none'&&cs.visibility!=='hidden'&&r.width>0&&r.height>0&&(r.width<44||r.height<44)}).map(e=>({text:e.textContent.trim().replace(/\s+/g,' ').slice(0,50),w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)}))
            }));
            await page.screenshot({path:`qa/humpbacked/humpbacked-${width}.png`,fullPage:true});
            report.push({width,count,spriteLoaded,galleryHeight,firstDialog,lastDialog,...metrics,errors,consoleErrors,failed});
            await ctx.close();
          }
          await browser.close();
          fs.writeFileSync('qa/humpbacked/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          EOF
          node qa/humpbacked/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: humpbacked-gallery-check
          path: qa/humpbacked
          retention-days: 1
