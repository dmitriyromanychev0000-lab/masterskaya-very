name: One-off desktop hero check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop-hero-check.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Start site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/site.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/index.html >/dev/null && exit 0; sleep 1; done
          cat /tmp/site.log; exit 1
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify desktop hero
        run: |
          mkdir -p qa/desktop-hero
          cat > qa/desktop-hero/check.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true});
          const ctx=await browser.newContext({viewport:{width:1440,height:1000}});
          const page=await ctx.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await page.evaluate(async()=>{if(document.fonts?.ready) await document.fonts.ready});
          await page.screenshot({path:'qa/desktop-hero/home-1440.png',fullPage:false});
          const metrics=await page.evaluate(()=>{
            const h1=document.querySelector('.hero h1');
            const range=document.createRange();
            range.selectNodeContents(h1);
            const rects=[...range.getClientRects()].map(r=>({top:Math.round(r.top),height:Math.round(r.height),width:Math.round(r.width)}));
            const uniqueLines=[...new Set(rects.map(r=>r.top))];
            const shell=document.querySelector('.hero-shell').getBoundingClientRect();
            const copy=document.querySelector('.hero-copy').getBoundingClientRect();
            const show=document.querySelector('.hero-showcase').getBoundingClientRect();
            return {
              viewport:innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              h1Text:h1.innerText,
              h1LineTops:uniqueLines,
              h1LineCount:uniqueLines.length,
              shell:{width:Math.round(shell.width),height:Math.round(shell.height)},
              copy:{width:Math.round(copy.width),height:Math.round(copy.height)},
              showcase:{width:Math.round(show.width),height:Math.round(show.height)}
            };
          });
          const report={...metrics,errors};
          fs.writeFileSync('qa/desktop-hero/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await ctx.close();
          await browser.close();
          EOF
          node qa/desktop-hero/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-hero-check
          path: qa/desktop-hero
          retention-days: 1
